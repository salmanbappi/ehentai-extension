name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  # Manual trigger
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build E-Hentai extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Bump version code
        run: python .github/scripts/bump-version.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/all/ehentai/build.gradle.kts
          git commit -m "chore: auto-bump version code [skip ci]" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.BOT_PAT }}@github.com/${{ github.repository }}.git
          git push origin HEAD:${{ github.ref_name }}

      - name: Prepare signing key
        run: |
          echo ${{ secrets.SIGNING_KEY }} | base64 -d > signingkey.jks

      - name: Build extension
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :src:all:ehentai:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.repository, 'salmanbappi/')
        with:
          name: "individual-apks"
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/keiyoushi-source-info.json
          retention-days: 1

      - name: Clean up CI files
        if: always()
        run: rm signingkey.jks

  publish:
    name: Publish extension repo
    needs: [build]
    if: startsWith(github.repository, 'salmanbappi/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ~/apk-artifacts

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          path: source
          persist-credentials: false

      - name: Checkout repo branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: salmanbappi/salmanbappi-manga-extension
          token: ${{ secrets.BOT_PAT }}
          ref: main
          path: repo
          persist-credentials: true

      - name: Publish repo
        run: |
          cd repo
          python ../source/.github/scripts/publish-repo.py ../source

      - name: Deploy repo
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10
        with:
          message: "Update extensions"
          cwd: "./repo"
          default_author: github_actions

      - name: Purge cached index on jsDelivr
        run: |
          curl https://purge.jsdelivr.net/gh/salmanbappi/salmanbappi-manga-extension@main/index.min.json
          curl https://purge.jsdelivr.net/gh/salmanbappi/salmanbappi-manga-extension@main/index.json
